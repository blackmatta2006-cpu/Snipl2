name: Build Android Debug APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore and Environment Config
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for GitHub Actions build..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=placeholder_api_key" > .env.example
          fi
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=placeholder_api_key" > .env
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Built APK to Staging
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/FiberGrid-Pro-debug.apk || cp app/build/outputs/apk/debug/*.apk apk/FiberGrid-Pro-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiberGrid-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

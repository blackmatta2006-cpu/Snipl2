name: Build Android Debug APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore and Environment Config
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for GitHub Actions build..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=placeholder_api_key" > .env.example
          fi
          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=placeholder_api_key" > .env
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Built APK to Staging
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/FiberGrid-Pro-debug.apk || cp app/build/outputs/apk/debug/*.apk apk/FiberGrid-Pro-debug.apk

      - name: Upload Debug APK Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: FiberGrid-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Upload to GitHub Release Assets if this build is for a Release or Tag
      - name: Upload APK to GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/FiberGrid-Pro-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Automatic Rolling Release on default branch push or manual trigger
      - name: Auto-Publish Latest Debug Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-debug"
          name: "FiberGrid Pro Debug APK (Latest)"
          body: "Automatic build of FiberGrid Pro Debug APK ready for installation on Android."
          prerelease: true
          files: apk/FiberGrid-Pro-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
